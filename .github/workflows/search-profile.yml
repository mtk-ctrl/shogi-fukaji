name: FUKAJI frozen 200ms search profile
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/fukaji-search-profile-request.json"
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-frozen-search-profile
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout independent FUKAJI
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate request and unit tests before profiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fukaji.search_profile import validate_request
          c = validate_request(json.loads(Path(".github/fukaji-search-profile-request.json").read_text()))
          assert c["paired_source_run_id"] == 40375047387
          assert c["relative_source_run_id"] == 40359123574
          print("bounded read-only profile preflight passed")
          PY
          python -m unittest discover -s tests -v
      - name: Download immutable KUMOJI match records
        uses: actions/download-artifact@v4
        with:
          name: fukaji-kumoji-paired-40375047387
          run-id: 40375047387
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/paired_source
      - name: Download immutable relative model
        uses: actions/download-artifact@v4
        with:
          name: fukaji-relative-trial-40359123574
          run-id: 40359123574
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/relative_source
      - name: Profile 200ms baseline/model search without modifying official engines
        run: |
          python -m fukaji.search_profile \
            --request .github/fukaji-search-profile-request.json \
            --games build/paired_source/paired_games.jsonl \
            --paired-report build/paired_source/paired_report.json \
            --model build/relative_source/mover-relative-v1.npz \
            --out build/search_profile
      - name: Save bounded profile and SHA provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fukaji-search-profile-${{ github.run_id }}
          path: build/search_profile/
          retention-days: 30
          if-no-files-found: warn
