name: FUKAJI G8 alpha-beta vs UCT fixed 200ms diagnostic (research only)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-g8-alpha-uct-position-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run targeted research tests
        run: python -m unittest discover -s tests -p 'test_*mcts_research.py' -v && python -m unittest discover -s tests -p 'test_search_method_probe.py' -v
      - name: Download frozen G8 research model
        uses: actions/download-artifact@v4
        with:
          name: fukaji-generation8-research-40636602223
          run-id: 40636602223
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/g8_probe/model
      - name: Download independently audited 240-game source
        uses: actions/download-artifact@v4
        with:
          name: fukaji-g8-paired-aggregate-40637486947
          run-id: 40637486947
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/g8_probe/source
      - name: Independently replay 240 games and measure 12 actual positions
        run: |
          python -m fukaji.search_method_probe \
            --model build/g8_probe/model/mover-relative-generation8-research.npz \
            --games build/g8_probe/source/all_paired_games.jsonl \
            --source-report build/g8_probe/source/paired_aggregate_report.json \
            --out build/g8_probe/results
      - name: Preserve SHA-checked per-position results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fukaji-g8-alpha-uct-probe-${{ github.run_id }}
          path: build/g8_probe/results/
          retention-days: 30
          if-no-files-found: warn
