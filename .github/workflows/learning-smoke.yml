name: FUKAJI learning pipeline
on:
  workflow_dispatch:
    inputs:
      attempts:
        description: "Random-baseline game attempts (pipeline test only)"
        required: true
        default: "40"
      epochs:
        required: true
        default: "4"
  push:
    paths:
      - "fukaji/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/learning-smoke.yml"
permissions:
  contents: read
concurrency:
  group: fukaji-learning-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Generate legal games and train baseline
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m fukaji.selfplay --attempts "${{ inputs.attempts }}" --out build/selfplay.jsonl
          python -m fukaji.learning --games build/selfplay.jsonl --out build/model --epochs "${{ inputs.epochs }}"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: fukaji-learning-${{ github.run_id }}
          path: |
            build/selfplay.jsonl
            build/model/
          retention-days: 30
