name: FUKAJI learning pipeline
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Training source (baseline is random smoke; engine uses FUKAJI alpha-beta)'
        type: choice
        options: [baseline, engine]
        default: baseline
      attempts:
        description: "Random-baseline game attempts (pipeline test only)"
        required: true
        default: "40"
      epochs:
        required: true
        default: "4"
  push:
    paths:
      - "fukaji/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/learning-smoke.yml"
permissions:
  contents: read
concurrency:
  group: fukaji-learning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Exercise real alpha-beta selfplay (bounded, no fabricated wins)
        run: |
          python -m fukaji.engine_selfplay --attempts 1 --movetime 1 --depth 1 --max-plies 12 --out build/engine-selfplay.jsonl
          python -m fukaji.audit --games build/engine-selfplay.jsonl --manifest build/engine-selfplay.manifest.json
      - name: Generate legal games and train baseline
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.source || 'baseline' }}" = "engine" ]; then
            python -m fukaji.engine_selfplay --attempts "${{ inputs.attempts || '40' }}" --movetime 5 --depth 2 --max-plies 320 --out build/selfplay.jsonl
            python -m fukaji.audit --games build/selfplay.jsonl --manifest build/selfplay.manifest.json
          else
            python -m fukaji.selfplay --attempts "${{ inputs.attempts || '40' }}" --out build/selfplay.jsonl
          fi
          python -m fukaji.learning --games build/selfplay.jsonl --out build/model --epochs "${{ inputs.epochs || '4' }}"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: fukaji-learning-${{ github.run_id }}
          path: |
            build/selfplay.jsonl
            build/model/
            build/engine-selfplay.jsonl
            build/engine-selfplay.manifest.json
          retention-days: 30
