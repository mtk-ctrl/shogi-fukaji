name: FUKAJI UCT parent-7 G8 clock trace (research only)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/fukaji-uct-parent7-g8-trace-request.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-uct-parent7-g8-trace
  cancel-in-progress: false
jobs:
  parent7-g8-trace:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Validate research request and lightweight tests
        run: |
          python -m unittest discover -s tests -p 'test_uct_parent7_g8_trace.py' -v
          python -m unittest discover -s tests -p 'test_mcts_research.py' -v
      - name: Check explicit default-disabled request
        id: protocol
        run: python -m fukaji.uct_parent7_g8_trace --check-request .github/fukaji-uct-parent7-g8-trace-request.json
      - name: Download frozen G8 model
        if: steps.protocol.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fukaji-generation8-research-40636602223
          run-id: 40636602223
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/parent7_g8/model
      - name: Download audited G8-G7 240-game source
        if: steps.protocol.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fukaji-g8-paired-aggregate-40637486947
          run-id: 40637486947
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/parent7_g8/source
      - name: Verify SHA and all 240 games then trace parent-7 G8
        if: steps.protocol.outputs.enabled == 'true'
        run: |
          python -m fukaji.uct_parent7_g8_trace \
            --games build/parent7_g8/source/all_paired_games.jsonl \
            --report build/parent7_g8/source/paired_aggregate_report.json \
            --model build/parent7_g8/model/mover-relative-generation8-research.npz \
            --out build/parent7_g8/results
      - name: Save eight raw rows and SHA receipt
        if: steps.protocol.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fukaji-uct-parent7-g8-trace-${{ github.run_id }}
          path: build/parent7_g8/results/
          retention-days: 30
          if-no-files-found: error
