name: FUKAJI frozen-dataset target and feature audit
on:
  push:
    paths:
      - ".github/fukaji-dataset-audit-request.json"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-dataset-audit
  cancel-in-progress: false
jobs:
  dataset-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate frozen source run and hashes
        id: source
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          config = json.loads(Path(".github/fukaji-dataset-audit-request.json").read_text())
          run = config["source_run_id"]
          if type(run) is not int or run <= 0:
              raise ValueError("invalid source run")
          for key in ("dataset_sha256", "model_sha256"):
              if not re.fullmatch("[0-9a-f]{64}", config[key]):
                  raise ValueError("invalid "+key)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run_id={run}\n")
          PY
      - name: Download frozen selfplay dataset and model
        uses: actions/download-artifact@v4
        with:
          name: fukaji-real-experiment-${{ steps.source.outputs.run_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/frozen_source
      - name: Replay and audit labels, parent groups and model representation
        run: |
          python -m fukaji.dataset_diagnostics --games build/frozen_source/combined_verified.jsonl --model build/frozen_source/value-v0.npz --request .github/fukaji-dataset-audit-request.json --out build/dataset_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fukaji-dataset-audit-${{ github.run_id }}
          path: build/dataset_audit/
          retention-days: 30
          if-no-files-found: warn
