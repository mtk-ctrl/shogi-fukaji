name: FUKAJI real-search learning experiment
on:
  push:
    paths:
      - ".github/fukaji-experiment-request.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fukaji-real-experiment
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Real search selfplay, verified target learning and paired arena
        run: |
          python -m fukaji.experiment --attempts 40 --movetime 2 --depth 1 --max-plies 300 --opening-plies 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fukaji-real-experiment-${{ github.run_id }}
          path: build/experiment/
          retention-days: 30
          if-no-files-found: warn
