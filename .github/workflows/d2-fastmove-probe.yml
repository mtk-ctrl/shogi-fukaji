name: FUKAJI D2 FastMoveList shared 200ms diagnostic (research only)
on:
  pull_request:
    paths:
      - 'fukaji/d2_fastmove_probe.py'
      - 'fukaji/engine.py'
      - 'tests/test_d2_fastmove_probe.py'
      - 'tests/test_d2_deadline.py'
      - '.github/workflows/d2-fastmove-probe.yml'
  workflow_dispatch:
  push:
    paths:
      - '.github/fukaji-d2-fastmove-request.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-d2-fastmove
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_d2_*.py' -v
      - run: python -m unittest discover -s tests -p 'test_depth_limit_probe.py' -v
      - run: python -m unittest discover -s tests -p 'test_engine.py' -v
  diagnostic:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: D2 protocol and engine regression
        run: |
          python -m unittest discover -s tests -p 'test_d2_*.py' -v
          python -m unittest discover -s tests -p 'test_depth_limit_probe.py' -v
          python -m unittest discover -s tests -p 'test_engine.py' -v
      - name: Validate frozen default-disabled request
        id: protocol
        run: python -m fukaji.d2_fastmove_probe --check-request .github/fukaji-d2-fastmove-request.json
      - name: Download frozen G8 model
        if: steps.protocol.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fukaji-generation8-research-40636602223
          run-id: 40636602223
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/d2/model
      - name: Download existing audited 240-game source
        if: steps.protocol.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fukaji-g8-paired-aggregate-40637486947
          run-id: 40637486947
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/d2/source
      - name: D2 fixed-depth parity then one-runner ABBA
        if: steps.protocol.outputs.enabled == 'true'
        run: |
          python -m fukaji.d2_fastmove_probe \
            --model build/d2/model/mover-relative-generation8-research.npz \
            --games build/d2/source/all_paired_games.jsonl \
            --source-report build/d2/source/paired_aggregate_report.json \
            --out build/d2/results
      - name: Save SHA-pinned research evidence
        if: steps.protocol.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fukaji-d2-fastmove-${{ github.run_id }}
          path: build/d2/results/
          retention-days: 30
          if-no-files-found: error
