name: FUKAJI frozen-data mover-relative value trial
on:
  push:
    paths:
      - ".github/fukaji-relative-trial-request.json"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-relative-feature-trial
  cancel-in-progress: false
jobs:
  relative-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate frozen source reference
        id: source
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          cfg = json.loads(Path(".github/fukaji-relative-trial-request.json").read_text())
          run = cfg["source_run_id"]
          if type(run) is not int or run <= 0:
              raise ValueError("invalid source run")
          for key in ("dataset_sha256", "model_sha256"):
              if not re.fullmatch("[0-9a-f]{64}", cfg[key]):
                  raise ValueError("invalid "+key)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run_id={run}\n")
          PY
      - name: Download frozen model and verified game dataset
        uses: actions/download-artifact@v4
        with:
          name: fukaji-real-experiment-${{ steps.source.outputs.run_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/frozen_source
      - name: Train isolated relative candidate and run equal-depth paired controls
        run: |
          python -m fukaji.relative_trial --games build/frozen_source/combined_verified.jsonl --legacy-model build/frozen_source/value-v0.npz --request .github/fukaji-relative-trial-request.json --out build/relative_trial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fukaji-relative-trial-${{ github.run_id }}
          path: build/relative_trial/
          retention-days: 30
          if-no-files-found: warn
