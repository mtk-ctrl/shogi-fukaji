name: FUKAJI paired-opening versus pinned KUMOJI
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/fukaji-kumoji-paired-request.json"
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-kumoji-paired-research
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout independent FUKAJI
        uses: actions/checkout@v4
      - name: Checkout pinned KUMOJI read-only
        uses: actions/checkout@v4
        with:
          repository: mtk-ctrl/shogi-ai
          ref: 807db500ee2739c1eb6a527b614eeea40a5993d6
          path: kumoji-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Validate bounded research request and lightweight tests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fukaji.kumoji_paired import validate_request
          c=validate_request(json.loads(Path(".github/fukaji-kumoji-paired-request.json").read_text()))
          assert c["kumoji_commit"] == "807db500ee2739c1eb6a527b614eeea40a5993d6"
          print("paired research preflight passed")
          PY
          python -m unittest discover -s tests -v
      - name: Build KUMOJI at pinned source without changes
        working-directory: kumoji-src
        run: python3 scripts/build.py --output build/shogi-ai
      - name: Download frozen FUKAJI mover-relative model
        uses: actions/download-artifact@v4
        with:
          name: fukaji-relative-trial-40359123574
          run-id: 40359123574
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/relative_source
      - name: Prepare FUKAJI USI process adapter
        shell: bash
        run: |
          mkdir -p build
          printf '#!/bin/sh\nexec python3 -m fukaji.engine\n' > build/fukaji-usi
          chmod 755 build/fukaji-usi
      - name: Execute paired equal-200ms and formal-KUMOJI arms with legal replay
        run: |
          python -m fukaji.kumoji_paired \
            --request .github/fukaji-kumoji-paired-request.json \
            --model build/relative_source/mover-relative-v1.npz \
            --kumoji-root kumoji-src \
            --fukaji-usi build/fukaji-usi \
            --out build/kumoji_paired
      - name: Save reproducible paired records and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fukaji-kumoji-paired-${{ github.run_id }}
          path: build/kumoji_paired/
          retention-days: 30
          if-no-files-found: warn
