name: FUKAJI frozen-model root alpha-beta 200ms arena
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/fukaji-root-alpha-arena-request.json"
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-root-alpha-paired-research
  cancel-in-progress: false
jobs:
  paired_arena:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Validate request and full unit test suite
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fukaji.root_alpha_arena import validate_request
          validate_request(json.loads(Path(".github/fukaji-root-alpha-arena-request.json").read_text()))
          PY
          python -m unittest discover -s tests -v
      - name: Download frozen relative model
        uses: actions/download-artifact@v4
        with:
          name: fukaji-relative-trial-40359123574
          run-id: 40359123574
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/model
      - name: Play color-swapped equal-time root-bound arena and legal replay
        run: |
          python -m fukaji.root_alpha_arena \
            --request .github/fukaji-root-alpha-arena-request.json \
            --model build/model/mover-relative-v1.npz \
            --out build/root_alpha_arena
      - name: Upload SHA-checked paired research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fukaji-root-alpha-arena-${{ github.run_id }}
          path: build/root_alpha_arena/
          retention-days: 30
          if-no-files-found: warn
