name: FUKAJI G8 exact legal replay selection (read-only)
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/fukaji-g8-selection-request.json"
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-g8-legal-selection
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      enabled: ${{ steps.protocol.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify all tests and exact frozen request
        id: protocol
        run: |
          python -m unittest discover -s tests -v
          python -m fukaji.g8_artifact_selection --request .github/fukaji-g8-selection-request.json
  replay:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Fetch original ZIP bytes, verify SHA and replay 400 legal games
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m fukaji.g8_artifact_selection \
            --request .github/fukaji-g8-selection-request.json \
            --out build/g8_replay
      - name: Save verified 100 candidate positions, splits and receipt
        uses: actions/upload-artifact@v4
        with:
          name: fukaji-g8-verified-selection-${{ github.run_id }}
          path: |
            build/g8_replay/selected/
            build/g8_replay/verification_receipt.json
          retention-days: 30
          if-no-files-found: error
