name: FUKAJI G8 tactical alpha-beta vs UCT 200ms (research only)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/fukaji-g8-tactical-uct-request.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-g8-tactical-uct-probe
  cancel-in-progress: false
jobs:
  tactical-probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Validate research protocol and targeted tests
        run: |
          python -m unittest discover -s tests -p 'test_tactical_positions.py' -v
          python -m unittest discover -s tests -p 'test_tactical_search_probe.py' -v
          python -m unittest discover -s tests -p 'test_search_method_probe.py' -v
      - name: Check explicit default-disabled request
        id: protocol
        run: python -m fukaji.tactical_search_probe --check-request .github/fukaji-g8-tactical-uct-request.json
      - name: Download frozen G8 model
        if: steps.protocol.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fukaji-generation8-research-40636602223
          run-id: 40636602223
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/tactical/model
      - name: Download audited 240-game source
        if: steps.protocol.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fukaji-g8-paired-aggregate-40637486947
          run-id: 40637486947
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/tactical/source
      - name: Legally replay all games and compare real tactical positions
        if: steps.protocol.outputs.enabled == 'true'
        run: |
          python -m fukaji.tactical_search_probe \
            --model build/tactical/model/mover-relative-generation8-research.npz \
            --games build/tactical/source/all_paired_games.jsonl \
            --source-report build/tactical/source/paired_aggregate_report.json \
            --out build/tactical/results
      - name: Save per-position evidence and summary
        if: steps.protocol.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fukaji-g8-tactical-uct-${{ github.run_id }}
          path: build/tactical/results/
          retention-days: 30
          if-no-files-found: error
