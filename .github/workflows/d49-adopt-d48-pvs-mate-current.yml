name: D49 formally adopt owner-approved D48 PVS plus mate search
on:
  workflow_dispatch:
    inputs:
      execute:
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - research/d49-adopt/START.json
permissions:
  contents: write
  actions: read
concurrency:
  group: fukaji-d49-owner-adopt-pvs-mate-d45
  cancel-in-progress: false
jobs:
  adopt:
    if: github.repository == 'mtk-ctrl/shogi-fukaji' && (github.event_name == 'push' || inputs.execute)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify unchanged baseline and prepare byte-identical D48 source
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          python scripts/check_fukaji_contracts.py
          python scripts/d49_adopt_d48_search.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          receipt=json.load(open('build/d49-adoption-prepare.json'))
          manifest=json.load(open('formal/model.json'))
          assert receipt['formal_version']=='FUKAJI v0.4.1'
          assert receipt['fixed_nnue_sha256']==manifest['weights_sha256']
          assert receipt['new_native_cpp_sha256']==manifest['search_implementation_sha256']
          assert manifest['research_snapshot_sha256']=='941598f2a9ec926d5f67dadf03582ccef718a56a843070dc1f576cc7eeca44e8'
          assert hashlib.sha256(Path('models/fukaji-d45.nnue.npz').read_bytes()).hexdigest()=='9faf66a9d1fee9d282e35835628377ab7951bb94335a5d0498384bf88f4d2c26'
          print('D49 model and exact D48 source locked')
          PY
      - name: Full formal contract and 713-case regression, C++ syntax, USI verification
        run: |
          set -euo pipefail
          python scripts/check_fukaji_contracts.py
          python -m compileall -q fukaji scripts
          python -m unittest discover -s tests -q
          python scripts/verify_formal_release.py --out build/d49-usi-verification.json
          python - <<'PY'
          import json
          a=json.load(open('build/d49-usi-verification.json'))
          assert a['version']=='FUKAJI v0.4.1',a
          assert a['research_mate_proof_verified'] is True,a
          assert a['search_backend_variant']=='d48_pvs_mate',a
          assert a['identical_depth2_positions']>=30,a
          assert a['usi_games']==2 and a['legal_usi_plies']>=30,a
          assert a['weights_sha256']=='9faf66a9d1fee9d282e35835628377ab7951bb94335a5d0498384bf88f4d2c26',a
          print('D49 actual native+USI mate and random legal games verified')
          PY
          git diff --check
      - name: Commit formal C++ and new contract only after passing all tests
        id: adoption
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "main moved during tests; refuse to overwrite";exit 1;
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/nnue_search_ffi.cpp formal/model.json
          git add research/d17-fast-self-learning/formal-contract.json
          git add tests/test_native_nnue_search.py tests/test_native_accumulator.py docs/現行エンジン仕様.md
          git add docs/00_開発ルーター.md docs/ROADMAP.md AGENTS.md
          git add docs/D48_MATE_PVS_PAIRED100_20261107.md
          git add docs/decisions/2026-11-07_D49_D48探索を正式採用.md
          git diff --cached --check
          git diff --cached --name-only | tee build/d49-files.txt
          test "$(git diff --cached --name-only | wc -l)" -eq 11
          git commit -m "adopt(D49): formally enable D48 PVS plus legal 1-3-5 mate proof on frozen D45 NNUE"
          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$final_sha"
          echo "source_sha=$final_sha" >> "$GITHUB_OUTPUT"
      - name: Build public current bundle and independently execute standalone USI
        env:
          SOURCE_SHA: ${{ steps.adoption.outputs.source_sha }}
        run: |
          set -euo pipefail
          python scripts/build_formal_bundle.py --out build/D49-FUKAJI-v0.4.1-D45-PVS-Mate.tar.gz --source-commit "$SOURCE_SHA"
          mkdir -p build/d49-isolated
          tar -xzf build/D49-FUKAJI-v0.4.1-D45-PVS-Mate.tar.gz -C build/d49-isolated
          (
            cd build/d49-isolated/fukaji-v0.4.1
            python scripts/verify_formal_release.py --out d49-isolated-usi.json
          )
          cp build/d49-isolated/fukaji-v0.4.1/d49-isolated-usi.json build/d49-isolated-usi.json
          python - <<'PY'
          import json
          d=json.load(open('build/d49-isolated-usi.json'))
          assert d['version']=='FUKAJI v0.4.1',d
          assert d['research_mate_proof_verified'] is True,d
          assert d['bundle_member_hashes_verified'] is True,d
          assert d['identical_depth2_positions']>=30 and d['usi_games']==2 and d['legal_usi_plies']>=30,d
          print('D49 extracted bundle passed source+model SHA and real USI mate proof')
          PY
      - name: Publish new adopted release and independently SHA-check downloaded assets
        env:
          SOURCE_SHA: ${{ steps.adoption.outputs.source_sha }}
          TAG: fukaji-current-d45-d49-pvs-mate-20261107
        run: |
          set -euo pipefail
          cp build/d49-adoption-prepare.json build/D49-adoption-receipt.json
          gh release create "$TAG" \
            build/D49-FUKAJI-v0.4.1-D45-PVS-Mate.tar.gz \
            build/d49-usi-verification.json \
            build/d49-isolated-usi.json \
            build/D49-adoption-receipt.json \
            --target "$SOURCE_SHA" \
            --title 'FUKAJI v0.4.1: D45 NNUE with adopted D48 PVS plus exact mate search' \
            --notes 'Owner-authorized 2026-11-07. D48 paired100: PVS+legal 1/3/5 mate 55-44, one unresolved. Same D45 NNUE SHA. Baseline v0.4.0 release preserved. Actual C++/USI test, isolated bundle checksum and GitHub Release SHA read-back.'
          mkdir -p build/d49-readback
          for file in \
            build/D49-FUKAJI-v0.4.1-D45-PVS-Mate.tar.gz \
            build/d49-usi-verification.json \
            build/d49-isolated-usi.json \
            build/D49-adoption-receipt.json; do
            name="$(basename "$file")"
            gh release download "$TAG" --pattern "$name" --dir build/d49-readback
            test "$(sha256sum "$file"|cut -d ' ' -f1)" = \
                 "$(sha256sum "build/d49-readback/$name"|cut -d ' ' -f1)"
          done
          echo "D49 adopted source $SOURCE_SHA, all Release SHA checked" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d49-adoption-checks-${{ github.run_id }}
          path: |
            build/d49-adoption-prepare.json
            build/d49-usi-verification.json
            build/d49-isolated-usi.json
            build/d49-files.txt
          if-no-files-found: warn
          retention-days: 30
