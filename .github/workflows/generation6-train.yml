name: FUKAJI frozen generation 6 research training
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/fukaji-generation6-request.json"
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-generation6-training
  cancel-in-progress: false
jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify all tests and frozen G6 request
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          from fukaji.generation6_train import validate_request
          validate_request(json.loads(Path('.github/fukaji-generation6-request.json').read_text()))
          PY
      - name: Download G5 model, 222 mates and frozen split assignments
        uses: actions/download-artifact@v4
        with:
          name: fukaji-generation5-research-40424947260
          run-id: 40424947260
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/generation6/old
      - name: Download 160 replay-verified G5 selfplay mates
        uses: actions/download-artifact@v4
        with:
          name: fukaji-generation5-selfplay-aggregate-40427032590
          run-id: 40427032590
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/generation6/new
      - name: Train research G6 from G5 using only frozen train parents
        run: |
          python -m fukaji.generation6_train \
            --request .github/fukaji-generation6-request.json \
            --old-data build/generation6/old/merged_verified_mates.jsonl \
            --old-report build/generation6/old/generation5_report.json \
            --old-splits build/generation6/old/frozen_parent_splits.json \
            --new-data build/generation6/new/verified_mates.jsonl \
            --new-report build/generation6/new/selfplay_aggregate_report.json \
            --generation5 build/generation6/old/mover-relative-generation5-research.npz \
            --out build/generation6/research
      - name: Upload unadopted G6 candidate, frozen split manifest and mates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fukaji-generation6-research-${{ github.run_id }}
          path: build/generation6/research/
          retention-days: 30
          if-no-files-found: error
