name: D65 adopt D64 Adam10974 NNUE on approved PVS mate v0.4.1
on:
  workflow_dispatch:
    inputs:
      execute:
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - research/d65-adopt/START.json
permissions:
  contents: write
  actions: read
concurrency:
  group: fukaji-d65-single-writer-current-nnue
  cancel-in-progress: false
jobs:
  adopt:
    if: github.repository == 'mtk-ctrl/shogi-fukaji' && (github.event_name == 'push' || inputs.execute)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Confirm F00 F20 owner mandate, D64 114-86 and pinned D49 native version
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          request=json.load(open('research/d65-adopt/START.json'))
          expected={
            "enabled":True,"request_id":"d65-d64-20261108-verified-audit-adopt",
            "source_run":42465412656,"audit_run":42465412656,
            "former":"e04e85dfebb507131df591bf0206e27771afe6944f3249124dfaf6eab5de51fb",
            "next":"545dba627046621ec53b681d485978b9054776c717d894dcb0de55bec731d4a2",
            "games_trained":1000,"audit_games":200,
            "after_wins":114,"before_wins":86,"draws":0,"unresolved":0,
            "optimizer_before":10080,"optimizer_after":10974,
            "train_sha256":"ae93fbe93c2de9dde16ba84945e13aca62f1c122a5edb99cd3796795f6fce2ea",
            "audit_sha256":"3a4b96fcf7d56975124704b6296734c912ff065dad2dbdb853004d051e7cb88e",
            "search_sha256":"c9340af265368547c37cbecc311d8d3982900885b433d1b4ccdc27fbdd7d041a",
            "version":"FUKAJI v0.4.1",
            "authority":"F00/F20 preauthorized direct current NNUE continuation when stronger"}
          if request!=expected:raise ValueError("D65 request differs from frozen D64 paired200")
          m=json.load(open('formal/model.json'))
          for k,value in [('research_snapshot_sha256',request['former']),('optimizer_step',10080),
                          ('weights_file','models/fukaji-d62.nnue.npz'),
                          ('search_implementation_sha256',request['search_sha256']),
                          ('version',request['version']),('search_backend_variant','d48_pvs_mate')]:
            if m.get(k)!=value:raise ValueError("old official model changed: "+k)
          assert hashlib.sha256(Path('native/nnue_search_ffi.cpp').read_bytes()).hexdigest()==request['search_sha256']
          PY
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Download D64 NNUE plus Adam10974 and frozen paired200 audit; SHA verify
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download fukaji-d64-d62-trained-42465412656 --pattern D64-D62-1000trained-unadopted.tar.gz --dir input
          gh release download fukaji-d64-d62-before-after-200games-42465412656 --pattern D64-D62-before-after-200games.tar.gz --dir input
          echo 'ae93fbe93c2de9dde16ba84945e13aca62f1c122a5edb99cd3796795f6fce2ea  input/D64-D62-1000trained-unadopted.tar.gz' | sha256sum -c -
          echo '3a4b96fcf7d56975124704b6296734c912ff065dad2dbdb853004d051e7cb88e  input/D64-D62-before-after-200games.tar.gz' | sha256sum -c -
      - name: Prepare formal D64 with fully checked optimizer, 200 game SHAs and unchanged mate search
        run: |
          python scripts/d65_adopt_d64.py \
            --trained input/D64-D62-1000trained-unadopted.tar.gz \
            --audit input/D64-D62-before-after-200games.tar.gz \
            --out build/d65-prepare
          cat build/d65-prepare/receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Validate source contracts and full regression with frozen search
        run: |
          set -euo pipefail
          python scripts/check_fukaji_contracts.py
          python -m unittest discover -s tests -q
          python -m compileall -q fukaji scripts
          git diff --check
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.load(open('build/d65-prepare/receipt.json'))
          m=json.load(open('formal/model.json'))
          assert m['version']=='FUKAJI v0.4.1' and m['search_backend_variant']=='d48_pvs_mate'
          assert m['search_implementation_sha256']==r['unchanged_cpp_sha256']
          assert m['weights_sha256']==r['weights_sha256']
          assert hashlib.sha256(Path('native/nnue_search_ffi.cpp').read_bytes()).hexdigest()==r['unchanged_cpp_sha256']
          assert hashlib.sha256(Path('models/fukaji-d62.nnue.npz').read_bytes()).hexdigest()=='3df737429572f27470e9f7a495cb772e569ed60135e3a1b6badfef53f67636ce'
          assert m['optimizer_step']==10974 and m['research_snapshot_sha256']==r['current_snapshot_sha256']
          print('D65 full static contract including old weights, new weights and PVS+mate pinned')
          PY
      - name: Real C++ NNUE, 1-ply mate proof and current USI legal play
        run: |
          python scripts/verify_formal_release.py --out build/d65-usi-validation.json
          python - <<'PY'
          import json
          d=json.load(open('build/d65-usi-validation.json'))
          assert d['version']=='FUKAJI v0.4.1',d
          assert d['search_backend_variant']=='d48_pvs_mate' and d['research_mate_proof_verified'] is True,d
          assert d['identical_depth2_positions']>=30 and d['usi_games']==2 and d['legal_usi_plies']>=30,d
          assert d['weights_sha256']==json.load(open('formal/model.json'))['weights_sha256'],d
          print('D65 real USI plays with exactly current search and D64 weights')
          PY
      - name: Atomically commit D64 official NNUE only after complete tests and main CAS
        id: adoption
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "main changed during D65; aborting without overwriting";exit 1;
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/fukaji-d64.nnue.npz
          git add formal/model.json research/d17-fast-self-learning/formal-contract.json
          git add docs/現行エンジン仕様.md docs/00_開発ルーター.md docs/ROADMAP.md
          git add AGENTS.md docs/decisions/2026-11-08_D65_D64学習後重みを現行採用.md
          git diff --cached --check
          git diff --cached --name-only | tee build/d65-adopted-files.txt
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git commit -m "adopt(D65): current D64 Adam10974 after 114-86 paired200; preserve PVS mate v0.4.1"
          new_sha="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$new_sha"
          echo "source_sha=$new_sha" >> "$GITHUB_OUTPUT"
      - name: Build independent bundle of formal D64 without search changes; execute USI
        env:
          SOURCE_SHA: ${{ steps.adoption.outputs.source_sha }}
        run: |
          set -euo pipefail
          python scripts/build_formal_bundle.py --out build/D65-FUKAJI-current-D64-PVS-Mate.tar.gz --source-commit "$SOURCE_SHA"
          mkdir -p build/d65-isolated
          tar -xzf build/D65-FUKAJI-current-D64-PVS-Mate.tar.gz -C build/d65-isolated
          (
            cd build/d65-isolated/fukaji-v0.4.1
            python scripts/verify_formal_release.py --out d65-isolated-usi.json
          )
          cp build/d65-isolated/fukaji-v0.4.1/d65-isolated-usi.json build/d65-isolated-usi.json
          python - <<'PY'
          import json
          d=json.load(open('build/d65-isolated-usi.json'))
          m=json.load(open('formal/model.json'))
          assert d['bundle_member_hashes_verified'] is True,d
          assert d['research_mate_proof_verified'] is True,d
          assert d['search_backend_variant']=='d48_pvs_mate' and d['version']=='FUKAJI v0.4.1',d
          assert d['identical_depth2_positions']>=30 and d['legal_usi_plies']>=30,d
          assert d['weights_sha256']==m['weights_sha256'],d
          print('D65 isolated official bundle actual USI and mate passed')
          PY
      - name: Publish D64 formal release and SHA-compare four downloaded assets
        env:
          SOURCE_SHA: ${{ steps.adoption.outputs.source_sha }}
          TAG: fukaji-current-d64-d65-pvs-mate-20261108
        run: |
          set -euo pipefail
          cp build/d65-prepare/receipt.json build/D65-adoption-receipt.json
          gh release create "$TAG" \
            build/D65-FUKAJI-current-D64-PVS-Mate.tar.gz \
            build/d65-usi-validation.json \
            build/d65-isolated-usi.json \
            build/D65-adoption-receipt.json \
            --target "$SOURCE_SHA" \
            --title 'FUKAJI v0.4.1 current D64 Adam10974 NNUE with D49 PVS plus mate' \
            --notes 'F00/F20 approval: D64 after 1000 direct games, 114-86 in independent paired200, unresolved0. NNUE only, USI v0.4.1 and PVS+mate unchanged. Full D62 state retained.'
          mkdir -p build/d65-readback
          for file in \
            build/D65-FUKAJI-current-D64-PVS-Mate.tar.gz \
            build/d65-usi-validation.json \
            build/d65-isolated-usi.json \
            build/D65-adoption-receipt.json; do
            name="$(basename "$file")"
            gh release download "$TAG" --pattern "$name" --dir build/d65-readback
            test "$(sha256sum "$file"|cut -d ' ' -f1)" = \
                 "$(sha256sum "build/d65-readback/$name"|cut -d ' ' -f1)"
          done
          echo "D65 current D64 source $SOURCE_SHA; four release SHA readback checks passed" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d65-adopt-nnue-verification-${{ github.run_id }}
          path: |
            build/d65-prepare/receipt.json
            build/d65-usi-validation.json
            build/d65-isolated-usi.json
            build/d65-adopted-files.txt
          if-no-files-found: warn
          retention-days: 30
