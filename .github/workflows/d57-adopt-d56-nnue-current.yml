name: D57 adopt D54 Adam7402 NNUE on approved PVS mate v0.4.1
on:
  workflow_dispatch:
    inputs:
      execute:
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - research/d57-adopt/START.json
permissions:
  contents: write
  actions: read
concurrency:
  group: fukaji-d57-single-writer-current-nnue
  cancel-in-progress: false
jobs:
  adopt:
    if: github.repository == 'mtk-ctrl/shogi-fukaji' && (github.event_name == 'push' || inputs.execute)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Confirm F00 F20 owner mandate, D54 135-65 and pinned D49 native version
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          request=json.load(open('research/d57-adopt/START.json'))
          expected={
            "enabled":True,"request_id":"d57-d56-20261108-verified-audit-adopt",
            "source_run":42433340061,
            "former":"1cb833c18be57d4881388bb6947f17493cca4974faac4023a4550ea47463f3f5",
            "next":"89562fd4fed556f4a883dba465add35c532cc2c7ccdae9efd24d685270246363",
            "games_trained":1000,"audit_games":200,
            "after_wins":135,"before_wins":65,"draws":0,"unresolved":0,
            "optimizer_before":6508,"optimizer_after":7402,
            "train_sha256":"4aa33cbc6991cb69008bb3b586ca089e36ed3a79f2c80340fc53dd8198c8bb87",
            "audit_sha256":"df4806113e4d1b07218172bc6464233783a6c10bec1c636a0d0c9bab9ef500dd",
            "search_sha256":"c9340af265368547c37cbecc311d8d3982900885b433d1b4ccdc27fbdd7d041a",
            "version":"FUKAJI v0.4.1",
            "authority":"F00/F20 preauthorized direct current NNUE continuation when stronger"}
          if request!=expected:raise ValueError("D57 request is not pinned to owner-authorized D52 audit")
          m=json.load(open('formal/model.json'))
          for k,value in [('research_snapshot_sha256',request['former']),('optimizer_step',6508),
                          ('weights_file','models/fukaji-d54.nnue.npz'),
                          ('search_implementation_sha256',request['search_sha256']),
                          ('version',request['version']),('search_backend_variant','d48_pvs_mate')]:
            if m.get(k)!=value:raise ValueError("old official model changed: "+k)
          assert hashlib.sha256(Path('native/nnue_search_ffi.cpp').read_bytes()).hexdigest()==request['search_sha256']
          PY
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Download D50 optimizer+NNUE and complete paired200 audit; SHA verify
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download fukaji-d56-d54-trained-42433340061 --pattern D56-D54-1000trained-unadopted.tar.gz --dir input
          gh release download fukaji-d56-d54-before-after-200games-42433340061 --pattern D56-D54-before-after-200games.tar.gz --dir input
          echo '4aa33cbc6991cb69008bb3b586ca089e36ed3a79f2c80340fc53dd8198c8bb87  input/D56-D54-1000trained-unadopted.tar.gz' | sha256sum -c -
          echo 'df4806113e4d1b07218172bc6464233783a6c10bec1c636a0d0c9bab9ef500dd  input/D56-D54-before-after-200games.tar.gz' | sha256sum -c -
      - name: Prepare formal D54 with fully checked optimizer, 200 game SHAs and unchanged mate search
        run: |
          python scripts/d57_adopt_d56.py \
            --trained input/D56-D54-1000trained-unadopted.tar.gz \
            --audit input/D56-D54-before-after-200games.tar.gz \
            --out build/d57-prepare
          cat build/d57-prepare/receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Validate source contracts and full regression with frozen search
        run: |
          set -euo pipefail
          python scripts/check_fukaji_contracts.py
          python -m unittest discover -s tests -q
          python -m compileall -q fukaji scripts
          git diff --check
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.load(open('build/d57-prepare/receipt.json'))
          m=json.load(open('formal/model.json'))
          assert m['version']=='FUKAJI v0.4.1' and m['search_backend_variant']=='d48_pvs_mate'
          assert m['search_implementation_sha256']==r['unchanged_cpp_sha256']
          assert m['weights_sha256']==r['weights_sha256']
          assert hashlib.sha256(Path('native/nnue_search_ffi.cpp').read_bytes()).hexdigest()==r['unchanged_cpp_sha256']
          assert hashlib.sha256(Path('models/fukaji-d54.nnue.npz').read_bytes()).hexdigest()=='5c2e011225e914d95b36afaecf56fd267db273a325de47bf371eaa93e8dc36a2'
          assert m['optimizer_step']==7402 and m['research_snapshot_sha256']==r['current_snapshot_sha256']
          print('D57 full static contract including old weights, new weights and PVS+mate pinned')
          PY
      - name: Real C++ NNUE, 1-ply mate proof and current USI legal play
        run: |
          python scripts/verify_formal_release.py --out build/d57-usi-validation.json
          python - <<'PY'
          import json
          d=json.load(open('build/d57-usi-validation.json'))
          assert d['version']=='FUKAJI v0.4.1',d
          assert d['search_backend_variant']=='d48_pvs_mate' and d['research_mate_proof_verified'] is True,d
          assert d['identical_depth2_positions']>=30 and d['usi_games']==2 and d['legal_usi_plies']>=30,d
          assert d['weights_sha256']==json.load(open('formal/model.json'))['weights_sha256'],d
          print('D57 real USI plays with exactly current search and D54 weights')
          PY
      - name: Atomically commit D52 official NNUE only after complete tests and main CAS
        id: adoption
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "main changed during D57; aborting without overwriting";exit 1;
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/fukaji-d56.nnue.npz
          git add formal/model.json research/d17-fast-self-learning/formal-contract.json
          git add docs/現行エンジン仕様.md docs/00_開発ルーター.md docs/ROADMAP.md
          git add AGENTS.md docs/decisions/2026-11-08_D57_D54学習後重みを現行採用.md
          git diff --cached --check
          git diff --cached --name-only | tee build/d57-adopted-files.txt
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git commit -m "adopt(D57): current NNUE D54 Adam7402 after 135-65 paired200; preserve PVS mate v0.4.1"
          new_sha="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$new_sha"
          echo "source_sha=$new_sha" >> "$GITHUB_OUTPUT"
      - name: Build independent bundle of formal D54 without search changes; execute USI
        env:
          SOURCE_SHA: ${{ steps.adoption.outputs.source_sha }}
        run: |
          set -euo pipefail
          python scripts/build_formal_bundle.py --out build/D57-FUKAJI-current-D56-PVS-Mate.tar.gz --source-commit "$SOURCE_SHA"
          mkdir -p build/d57-isolated
          tar -xzf build/D57-FUKAJI-current-D56-PVS-Mate.tar.gz -C build/d57-isolated
          (
            cd build/d57-isolated/fukaji-v0.4.1
            python scripts/verify_formal_release.py --out d57-isolated-usi.json
          )
          cp build/d57-isolated/fukaji-v0.4.1/d57-isolated-usi.json build/d57-isolated-usi.json
          python - <<'PY'
          import json
          d=json.load(open('build/d57-isolated-usi.json'))
          m=json.load(open('formal/model.json'))
          assert d['bundle_member_hashes_verified'] is True,d
          assert d['research_mate_proof_verified'] is True,d
          assert d['search_backend_variant']=='d48_pvs_mate' and d['version']=='FUKAJI v0.4.1',d
          assert d['identical_depth2_positions']>=30 and d['legal_usi_plies']>=30,d
          assert d['weights_sha256']==m['weights_sha256'],d
          print('D57 isolated official bundle actual USI and mate passed')
          PY
      - name: Publish D50 formal release and SHA-compare four downloaded assets
        env:
          SOURCE_SHA: ${{ steps.adoption.outputs.source_sha }}
          TAG: fukaji-current-d56-d57-pvs-mate-20261108
        run: |
          set -euo pipefail
          cp build/d57-prepare/receipt.json build/D57-adoption-receipt.json
          gh release create "$TAG" \
            build/D57-FUKAJI-current-D56-PVS-Mate.tar.gz \
            build/d57-usi-validation.json \
            build/d57-isolated-usi.json \
            build/D57-adoption-receipt.json \
            --target "$SOURCE_SHA" \
            --title 'FUKAJI v0.4.1 current D54 Adam7402 NNUE with D49 PVS plus mate' \
            --notes 'Owner-delegated F00/F20: 1000 new D52 v0.4.1 selfplay, D54 wins paired200 135-65 with 1 unresolved. NNUE only changes; v0.4.1 C++ PVS and forced mate search unchanged. Existing D52 full optimizer and old release preserved.'
          mkdir -p build/d57-readback
          for file in \
            build/D57-FUKAJI-current-D56-PVS-Mate.tar.gz \
            build/d57-usi-validation.json \
            build/d57-isolated-usi.json \
            build/D57-adoption-receipt.json; do
            name="$(basename "$file")"
            gh release download "$TAG" --pattern "$name" --dir build/d57-readback
            test "$(sha256sum "$file"|cut -d ' ' -f1)" = \
                 "$(sha256sum "build/d57-readback/$name"|cut -d ' ' -f1)"
          done
          echo "D57 current D52 source $SOURCE_SHA; four release SHA readback checks passed" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d57-adopt-nnue-verification-${{ github.run_id }}
          path: |
            build/d57-prepare/receipt.json
            build/d57-usi-validation.json
            build/d57-isolated-usi.json
            build/d57-adopted-files.txt
          if-no-files-found: warn
          retention-days: 30
