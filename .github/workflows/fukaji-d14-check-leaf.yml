name: D14 FUKAJI G8 checked-horizon 200ms historical ABBA

on:
  push:
    branches: [main]
    paths:
      - ".github/fukaji-d14-check-leaf-request.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fukaji-d14-check-leaf
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preserve actual D14 research run before experiments
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const path="research/d14-check-leaf/run-status.json";
            const state={run_id:context.runId,status:"started",revision:context.sha,
              url:"https://github.com/"+owner+"/"+repo+"/actions/runs/"+context.runId,
              updated_at:new Date().toISOString(),formal_adoption:false};
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:"main"})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            const args={owner,repo,path,branch:"main",
              message:"ci(D14): record real check-leaf ABBA run",
              content:Buffer.from(JSON.stringify(state,null,2)+"\n").toString("base64")};
            if(sha)args.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(args);
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Check D14 exact legal defense proof and official v0.1.0 safety
        id: regress
        run: |
          python -m compileall -q fukaji
          python -m unittest discover -s tests -p 'test_d14_check_leaf.py' -v
          python -m unittest discover -s tests -p 'test_fast_legal_guard.py' -v
          python -m unittest discover -s tests -p 'test_engine.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: fukaji-kumoji-full100-aggregate-41177748192
          run-id: 41177748192
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/d14/history
      - uses: actions/download-artifact@v4
        with:
          name: fukaji-generation8-research-40636602223
          run-id: 40636602223
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/d14/model-source
      - name: Verify strict historical-games and original G8 model hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          from fukaji.d14_check_leaf_probe import MODEL_SHA
          from fukaji.kumoji_loss_study import GAMES_SHA
          root=Path("build/d14")
          game=root/"history/all_games.jsonl"
          model=next((root/"model-source").rglob("mover-relative-generation8-research.npz"),None)
          if model is None or not game.is_file():raise ValueError("original D14 inputs missing")
          if hashlib.sha256(game.read_bytes()).hexdigest()!=GAMES_SHA:raise ValueError("historical games SHA changed")
          if hashlib.sha256(model.read_bytes()).hexdigest()!=MODEL_SHA:raise ValueError("G8 source SHA changed")
          shutil.copyfile(model,root/"g8.npz")
          print("Original 100 KUMOJI failures and G8 SHA verified")
          PY
      - name: Compare 12 checked roots x OFF-ON-ON-OFF under 200ms
        id: diagnostic
        run: |
          python -m fukaji.d14_check_leaf_probe \
            --games build/d14/history/all_games.jsonl \
            --model build/d14/g8.npz \
            --out build/d14/results
      - name: Save independently verified D14 result on main
        id: save
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require("fs");
            const {owner,repo}=context.repo;
            const path="research/d14-check-leaf/diagnosis.json";
            const content=fs.readFileSync("build/d14/results/diagnosis.json","utf8");
            const report=JSON.parse(content);
            if(report.historical_checked_roots!==12||report.total_abba_calls!==48
               ||report.G8_model_sha256!=="18b39f647caa458389a1900b875337adadac74ae37e27343e7f0094ed663c492")
              throw Error("D14 output incomplete or source model mismatch");
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:"main"})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            const args={owner,repo,path,branch:"main",
              message:"research(D14): archive real 48-call G8 check-evasion historical A/B",
              content:Buffer.from(content).toString("base64")};
            if(sha)args.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(args);
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d14-G8-check-leaf-${{ github.run_id }}
          path: build/d14/results/
          retention-days: 90
          if-no-files-found: warn
      - name: Record terminal research status without altering official engine
        if: always()
        uses: actions/github-script@v7
        env:
          TESTS: ${{ steps.regress.outcome }}
          DIAGNOSTIC: ${{ steps.diagnostic.outcome }}
          SAVE: ${{ steps.save.outcome }}
        with:
          script: |
            const {owner,repo}=context.repo;
            const success=process.env.TESTS==="success"&&process.env.DIAGNOSTIC==="success"&&process.env.SAVE==="success";
            const state={run_id:context.runId,status:success?"verified_48_calls":"failed_or_incomplete",
              revision:context.sha,url:"https://github.com/"+owner+"/"+repo+"/actions/runs/"+context.runId,
              stages:{tests:process.env.TESTS,diagnostic:process.env.DIAGNOSTIC,save:process.env.SAVE},
              updated_at:new Date().toISOString(),formal_adoption:false};
            const path="research/d14-check-leaf/run-status.json";
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:"main"})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            const args={owner,repo,path,branch:"main",
              message:"research(D14): record terminal check-leaf evidence status",
              content:Buffer.from(JSON.stringify(state,null,2)+"\n").toString("base64")};
            if(sha)args.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(args);
            if(!success)core.setFailed("D14 200ms research not fully verified");
