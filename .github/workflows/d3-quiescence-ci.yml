name: FUKAJI D3 quiescence research CI
on:
  pull_request:
    paths:
      - 'fukaji/quiescence.py'
      - 'fukaji/engine.py'
      - 'tests/test_d3_quiescence.py'
      - 'fukaji/d3_tactical_probe.py'
      - 'fukaji/d3_quiescence_profile.py'
      - 'tests/test_d3_quiescence_profile.py'
      - 'tests/test_d3_tactical_probe.py'
      - '.github/fukaji-d3-tactical-request.json'
      - '.github/workflows/d3-quiescence-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_d3_quiescence.py' -v
      - run: python -m unittest discover -s tests -p 'test_engine.py' -v
      - run: python -m unittest discover -s tests -p 'test_d3_tactical_probe.py' -v
      - run: python -m unittest discover -s tests -p 'test_d3_quiescence_profile.py' -v
      - run: python -m fukaji.d3_quiescence_profile
      - run: python -m fukaji.d3_tactical_probe --self-check
      - run: python -m fukaji.d3_tactical_probe --mate-choice-check
      - run: python -m fukaji.d3_tactical_probe --poison-choice-check
      - run: python -m fukaji.d3_tactical_probe --check-request .github/fukaji-d3-tactical-request.json
