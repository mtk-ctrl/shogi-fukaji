name: FUKAJI UCT phase profile on two frozen positions (research only)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/fukaji-uct-phase-request.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-uct-phase-profile
  cancel-in-progress: false
jobs:
  phase-profile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Offline phase protocol and UCT tests
        run: |
          python -m unittest discover -s tests -p 'test_uct_phase_probe.py' -v
          python -m unittest discover -s tests -p 'test_mcts_research.py' -v
      - name: Check explicit frozen request
        id: protocol
        run: python -m fukaji.uct_phase_probe --check-request .github/fukaji-uct-phase-request.json
      - name: Download frozen G8 model
        if: steps.protocol.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fukaji-generation8-research-40636602223
          run-id: 40636602223
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/uct_phase/model
      - name: Download independently audited 240-game source
        if: steps.protocol.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fukaji-g8-paired-aggregate-40637486947
          run-id: 40637486947
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/uct_phase/source
      - name: Replay all 240 games and profile frozen parents 6 and 11
        if: steps.protocol.outputs.enabled == 'true'
        run: |
          python -m fukaji.uct_phase_probe \
            --games build/uct_phase/source/all_paired_games.jsonl \
            --report build/uct_phase/source/paired_aggregate_report.json \
            --model build/uct_phase/model/mover-relative-generation8-research.npz \
            --out build/uct_phase/results
      - name: Preserve raw iteration timings and SHA receipt
        if: steps.protocol.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fukaji-uct-phase-${{ github.run_id }}
          path: build/uct_phase/results/
          retention-days: 30
          if-no-files-found: error
