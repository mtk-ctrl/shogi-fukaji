name: FUKAJI versus pinned KUMOJI USI smoke
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/fukaji-kumoji-smoke-request.json"
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-kumoji-usi-smoke
  cancel-in-progress: false
jobs:
  usi-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout independent FUKAJI
        uses: actions/checkout@v4
      - name: Checkout pinned KUMOJI source (read-only)
        uses: actions/checkout@v4
        with:
          repository: mtk-ctrl/shogi-ai
          ref: 807db500ee2739c1eb6a527b614eeea40a5993d6
          path: kumoji-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Validate request and run lightweight tests before building
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fukaji.kumoji_match import validate_request
          c = validate_request(json.loads(Path(".github/fukaji-kumoji-smoke-request.json").read_text()))
          assert c["kumoji_commit"] == "807db500ee2739c1eb6a527b614eeea40a5993d6"
          assert c["relative_source_run_id"] == 40359123574
          print("research-only request preflight passed")
          PY
          python -m unittest discover -s tests -v
      - name: Build official KUMOJI without modifying its repository
        working-directory: kumoji-src
        run: python3 scripts/build.py --output build/shogi-ai
      - name: Download fixed mover-relative model
        uses: actions/download-artifact@v4
        with:
          name: fukaji-relative-trial-40359123574
          run-id: 40359123574
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/relative_source
      - name: Create executable FUKAJI USI adapter (no binary redistribution)
        shell: bash
        run: |
          mkdir -p build
          printf '#!/bin/sh\nexec python3 -m fukaji.engine\n' > build/fukaji-usi
          chmod 755 build/fukaji-usi
      - name: Frozen model, USI, legal replay and knowledge/timing audit
        run: |
          python -m fukaji.kumoji_match \
            --request .github/fukaji-kumoji-smoke-request.json \
            --model build/relative_source/mover-relative-v1.npz \
            --kumoji-root kumoji-src \
            --fukaji-usi build/fukaji-usi \
            --out build/kumoji_smoke
      - name: Upload research-only audit and game records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fukaji-kumoji-smoke-${{ github.run_id }}
          path: build/kumoji_smoke/
          retention-days: 30
          if-no-files-found: warn
