name: E11 king-relative NNUE train (親E10を玉相対特徴へ拡張して学習。研究専用・正式版は変更しない)
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "エポック数"
        required: true
        default: "3"
        type: string
      lr:
        description: "学習率"
        required: true
        default: "0.0003"
        type: string
      outcome_weight:
        description: "対局結果の混合比"
        required: true
        default: "0.2"
        type: string
      feature_set:
        description: "king=玉相対17x17(+15028入力) / zone=玉周辺±2升(+1300入力)"
        required: true
        default: "zone"
        type: string
      parent_tag:
        description: "親(E10)の完全stateを含むReleaseタグ"
        required: true
        default: "fukaji-current-e10-pvs-mate-20261113"
        type: string
      parent_asset:
        description: "親のstate資産名"
        required: true
        default: "E10-trained-state-Adam.tar.gz"
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-kr-train
  cancel-in-progress: false
jobs:
  train:
    if: github.repository == 'mtk-ctrl/shogi-fukaji'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_fukaji_contracts.py
      - uses: actions/download-artifact@v4
        with:
          pattern: round-sparring-*-42591748743
          path: input/parts
          run-id: 42591748743
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: hybrid-part-*-43356404607
          path: input/parts
          run-id: 43356404607
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: hybrid-part-*-43356418237
          path: input/parts
          run-id: 43356418237
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: e2-labels-*-43211652947
          path: input/labels1
          run-id: 43211652947
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: e2-labels-*-43365489504
          path: input/labels2
          run-id: 43365489504
          github-token: ${{ github.token }}
      - name: Download archives and parent state
        run: |
          set -euo pipefail
          mkdir -p input/archives
          gh release download fukaji-d66-d64-1000-selfplay-42471868758 --pattern D66-D64-1000games.tar.gz --dir input/archives
          gh release download fukaji-d68-d66-1000-selfplay-42540661474 --pattern D68-D66-1000games.tar.gz --dir input/archives
          echo '9e711baf83563827f777dd8c43ddb1ec85dacec5b10255caff2ad48fc194e6ef  input/archives/D66-D64-1000games.tar.gz' | sha256sum -c -
          echo 'd902a6ef591643129cef9e53c1dc322b7778f011473e66fb2380a4f388250585  input/archives/D68-D66-1000games.tar.gz' | sha256sum -c -
          gh release download ${{ inputs.parent_tag }} --pattern ${{ inputs.parent_asset }} --dir input
          mkdir -p input/parent && tar -xzf input/${{ inputs.parent_asset }} -C input/parent models
      - name: Train (king-relative expansion)
        run: |
          python -u scripts/e11_train_kr.py --state research/d41-public/D37-Adam2106-training-state.tar.gz \
            --parent-models input/parent/models --parts input/parts \
            --archives input/archives/D66-D64-1000games.tar.gz input/archives/D68-D66-1000games.tar.gz \
            --labels input/labels1 input/labels2 --out trained --epochs ${{ inputs.epochs }} --lr ${{ inputs.lr }} \
            --outcome-weight ${{ inputs.outcome_weight }} --feature-set ${{ inputs.feature_set }} | tee train.log
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          print('### E11 king-relative train');print('```json');print(json.dumps(json.load(open('trained/report.json')),indent=1,ensure_ascii=False));print('```')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e2-trained-${{ github.run_id }}
          path: |
            trained/cand-weights.npz
            trained/report.json
          retention-days: 60
