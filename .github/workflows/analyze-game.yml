name: Analyze game (棋譜の指定した手を正式エンジンで検討。閲覧専用)
# 研究・閲覧専用。結果はジョブのログ(Analyzeステップ)に出す。正式版は変更しない。
on:
  workflow_dispatch:
    inputs:
      moves:
        description: "開始局面からのUSI手順(空白区切り)"
        required: true
        type: string
      plies:
        description: "検討する手数(1始まり、カンマ区切り)"
        required: true
        type: string
      alts:
        description: '代替手のJSON 例 {"67":["1d1b+"]}'
        required: true
        default: "{}"
        type: string
      ms:
        description: "1局面あたりの思考時間(ms)"
        required: true
        default: "3000"
        type: string
      kumoji_ref:
        description: "雲路のコミットSHA(探索の借用元)"
        required: true
        default: "199dbb0b6a760b9341c27f3a0f4aaeaa7dae4e89"
        type: string
permissions:
  contents: read
concurrency:
  group: fukaji-analyze
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mtk-ctrl/shogi-ai
          ref: ${{ inputs.kumoji_ref }}
          path: kumoji-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Build hybrid engine
        run: |
          set -euo pipefail
          python scripts/build_hybrid.py --kumoji-src kumoji-src --work build/hybrid
          python scripts/hybrid_export_weights.py formal build/hybrid.bin
          S="$(python -c "import json;print(json.load(open('formal/model.json'))['hybrid']['nnue_scale'])")"
          printf '#!/bin/sh\nexport FUKAJI_NNUE_FILE="%s/build/hybrid.bin"\nexport FUKAJI_NNUE_SCALE="%s"\nexport FUKAJI_NNUE_INCREMENTAL="0"\ncd "%s/build/hybrid"\nexec "%s/build/hybrid/build/kumoji-hybrid" "$@"\n' "$PWD" "$S" "$PWD" "$PWD" > /tmp/a.sh
          chmod +x /tmp/a.sh
      - name: Analyze
        run: |
          python scripts/analyze_game.py --engine /tmp/a.sh --moves "${{ inputs.moves }}" --plies "${{ inputs.plies }}" --alts '${{ inputs.alts }}' --ms "${{ inputs.ms }}"
