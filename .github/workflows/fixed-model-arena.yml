name: FUKAJI fixed-model search-time comparison
on:
  push:
    paths:
      - ".github/fukaji-fixed-arena-request.json"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-fixed-model-arena
  cancel-in-progress: false
jobs:
  fixed-model-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Resolve source run from validated request
        id: source
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          config=json.loads(Path(".github/fukaji-fixed-arena-request.json").read_text())
          run=config["source_run_id"]
          if type(run) is not int or run<=0:
              raise ValueError("invalid source_run_id")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"run_id={run}\n")
          PY
      - name: Download frozen model artifact from this repository
        uses: actions/download-artifact@v4
        with:
          name: fukaji-real-experiment-${{ steps.source.outputs.run_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/fixed_model
      - name: Run SHA-verified 2ms and 20ms paired controls
        run: |
          python -m fukaji.fixed_arena --model build/fixed_model/value-v0.npz --request .github/fukaji-fixed-arena-request.json --out build/fixed_arena
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fukaji-fixed-arena-${{ github.run_id }}
          path: build/fixed_arena/
          retention-days: 30
          if-no-files-found: warn
