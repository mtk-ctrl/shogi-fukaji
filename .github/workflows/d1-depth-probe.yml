name: FUKAJI D1 depth cap 2 vs 6 (research only)
on:
  pull_request:
    paths:
      - 'fukaji/depth_limit_probe.py'
      - 'fukaji/engine.py'
      - 'tests/test_depth_limit_probe.py'
      - '.github/workflows/d1-depth-probe.yml'
  workflow_dispatch:
  push:
    paths:
      - '.github/fukaji-d1-depth-request.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-d1-depth
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_depth_limit_probe.py' -v
      - run: python -m unittest discover -s tests -p 'test_engine.py' -v
  depth-diagnostic:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: D1 bounded protocol and timing tests
        run: |
          python -m unittest discover -s tests -p 'test_depth_limit_probe.py' -v
          python -m unittest discover -s tests -p 'test_engine.py' -v
      - name: Validate explicit default-disabled request
        id: protocol
        run: python -m fukaji.depth_limit_probe --check-request .github/fukaji-d1-depth-request.json
      - name: Download frozen G8 model
        if: steps.protocol.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fukaji-generation8-research-40636602223
          run-id: 40636602223
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/d1/model
      - name: Download existing audited 240-game source
        if: steps.protocol.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fukaji-g8-paired-aggregate-40637486947
          run-id: 40637486947
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/d1/source
      - name: Freeze selection then run A-B-B-A on one runner
        if: steps.protocol.outputs.enabled == 'true'
        run: |
          python -m fukaji.depth_limit_probe \
            --model build/d1/model/mover-relative-generation8-research.npz \
            --games build/d1/source/all_paired_games.jsonl \
            --source-report build/d1/source/paired_aggregate_report.json \
            --out build/d1/results
      - name: Save SHA-pinned diagnostic evidence
        if: steps.protocol.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fukaji-d1-depth-${{ github.run_id }}
          path: build/d1/results/
          retention-days: 30
          if-no-files-found: error
