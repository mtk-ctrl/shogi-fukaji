name: FUKAJI D5 frozen evaluation diagnosis (read-only)
on:
  pull_request:
    paths:
      - 'fukaji/d5_eval_diagnosis.py'
      - 'tests/test_d5_eval_diagnosis.py'
      - '.github/workflows/d5-eval-diagnosis.yml'
  push:
    branches: [main]
    paths:
      - 'fukaji/d5_eval_diagnosis.py'
      - 'tests/test_d5_eval_diagnosis.py'
      - '.github/workflows/d5-eval-diagnosis.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-d5-diagnosis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  read-only-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify deterministic split and label safety
        run: python -m unittest discover -s tests -p 'test_d5_eval_diagnosis.py' -v
      - name: Verify original artifacts and all 240 legal histories; score development only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m fukaji.d5_eval_diagnosis --out d5-diagnosis-output
      - name: Save read-only development observations
        uses: actions/upload-artifact@v4
        with:
          name: d5-eval-development-${{ github.run_id }}
          path: |
            d5-diagnosis-output/d5-development-diagnosis.json
            d5-diagnosis-output/d5-summary.json
          retention-days: 30
