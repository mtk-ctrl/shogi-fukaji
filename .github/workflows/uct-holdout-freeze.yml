name: FUKAJI UCT frozen holdout source legality (research only)
on:
  pull_request:
    paths:
      - 'fukaji/uct_holdout_freeze.py'
      - 'docs/UCT_HOLDOUT_12_PARENTS_20261029.json'
      - '.github/workflows/uct-holdout-freeze.yml'
  push:
    branches: [main]
    paths:
      - 'fukaji/uct_holdout_freeze.py'
      - 'docs/UCT_HOLDOUT_12_PARENTS_20261029.json'
      - '.github/workflows/uct-holdout-freeze.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-holdout-legality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  replay-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Download frozen 240-game source only (no G8 model or timing run)
        uses: actions/download-artifact@v4
        with:
          name: fukaji-g8-paired-aggregate-40637486947
          run-id: 40637486947
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/holdout/source
      - name: Verify original SHA, all 240 legal games and 24 frozen parent SFENs
        run: |
          python -m fukaji.uct_holdout_freeze \
            --games build/holdout/source/all_paired_games.jsonl \
            --report build/holdout/source/paired_aggregate_report.json \
            --out build/holdout/validation.json
      - name: Preserve lightweight validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: fukaji-uct-holdout-legality-${{ github.run_id }}
          path: build/holdout/validation.json
          retention-days: 30
          if-no-files-found: error
