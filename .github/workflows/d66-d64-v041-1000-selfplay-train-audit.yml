          expected="$(sha256sum "$file" | cut -d ' ' -f1)"
          model_sha="$(python -c 'import json;print(json.load(open("trained/report.json"))["trained_sha256"])')"
          gh release create "$TAG" "$file" --target "$GITHUB_SHA" --title 'D66: v0.4.1 D52 NNUE Adam continuation before audit' --notes 'Learn current D52 from 1000 new PVS+mate games, plus permitted prior train replay. Full optimizer and NNUE preserved, not yet formally adopted.'
          mkdir -p readback
          gh release download "$TAG" --pattern D66-D64-1000trained-unadopted.tar.gz --dir readback
          test "$expected" = "$(sha256sum readback/D66-D64-1000trained-unadopted.tar.gz | cut -d ' ' -f1)"
          echo "trained_sha=$expected" >> "$GITHUB_OUTPUT"
          echo "model_sha=$model_sha" >> "$GITHUB_OUTPUT"
          cat trained/report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d66-trained-receipt-${{ github.run_id }}
          path: |
