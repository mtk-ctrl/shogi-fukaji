          gh release download fukaji-d64-d62-trained-42465412656 --pattern D64-D62-1000trained-unadopted.tar.gz --dir input
          gh release download fukaji-d64-d62-1000-selfplay-42465412656 --pattern D64-D62-1000games.tar.gz --dir input
          echo '${{ needs.aggregate.outputs.source_sha }}  input/D66-D64-1000games.tar.gz' | sha256sum -c -
          echo 'ae93fbe93c2de9dde16ba84945e13aca62f1c122a5edb99cd3796795f6fce2ea  input/D64-D62-1000trained-unadopted.tar.gz' | sha256sum -c -
          echo '5def465bc811824d380001f40360055171b26e2c3202710717d1b2509391e56d  input/D64-D62-1000games.tar.gz' | sha256sum -c -
      - name: Continue current D56 Adam7402 from verified D54 selfplay
