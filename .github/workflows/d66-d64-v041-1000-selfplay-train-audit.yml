name: D66 v0.4.1 D64 PVS+mate 1000 selfplay training paired200 audit
on:
  workflow_dispatch:
    inputs:
      execute:
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - research/d66/START.json
permissions:
  contents: write
  actions: read
concurrency:
  group: fukaji-d66-v041-d64-1000-selfplay-audit
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'mtk-ctrl/shogi-fukaji' && (github.event_name == 'push' || inputs.execute)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Guard D66 request, formal v0.4.1 and SHA pinned optimizer
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          q=json.load(open('research/d66/START.json'))
          expected={'enabled':True,'request_id':'d66-20261108-d64-v041-selfplay1000-20runner',
            'baseline':'545dba627046621ec53b681d485978b9054776c717d894dcb0de55bec731d4a2',
            'weights_sha256':'fd5f832e0ded9519c23ad7469eee7a79f70d78f41bc0dab87c5f7bc57c8d478a',
            'optimizer_step':10974,'search_variant':'d48_pvs_mate',
            'search_sha256':'c9340af265368547c37cbecc311d8d3982900885b433d1b4ccdc27fbdd7d041a',
            'version':'FUKAJI v0.4.1','games':1000,'runners':20,'rounds':5,'compare_games':200,
            'formal_weights_adopt_after_verified_win':True}
          if q!=expected:raise SystemExit('D66 exact request drift')
          f=json.load(open('formal/model.json'))
          for k,v in [('research_snapshot_sha256',q['baseline']),('weights_sha256',q['weights_sha256']),('optimizer_step',10974),('version',q['version']),('search_implementation_sha256',q['search_sha256']),('search_backend_variant',q['search_variant'])]:
            if f.get(k)!=v:raise SystemExit('D66 formal version changed: '+k)
          if hashlib.sha256(Path('native/nnue_search_ffi.cpp').read_bytes()).hexdigest()!=q['search_sha256']:raise SystemExit('D49 official CPP changed')
          if hashlib.sha256(Path(f['weights_file']).read_bytes()).hexdigest()!=q['weights_sha256']:raise SystemExit('D62 inference changed')
          print('D66 verified formal current NNUE D64/Adam10974, v0.4.1 mate plus PVS')
          PY
      - name: Source contracts, syntax, and known one-ply mate
        run: |
          set -euo pipefail
          python scripts/check_fukaji_contracts.py
          python -m py_compile scripts/d66_native_game.py scripts/d66_games.py scripts/d66_train.py scripts/d66_arena.py
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/d66_arena.py').read_text()
          assert 'parent_report["schema"]!="d64-learned1000-v1"' in p
          assert 'report["schema"]!="d66-learned1000-v1"' in p
          assert 'plan={"schema":"d66-paired200-v1"' in p
          assert 'if plan["schema"]!="d66-paired200-v1"' in p
          assert 'inconclusive_keep_D64' in p
          g=Path('scripts/d66_games.py').read_text()
          assert '__D63_FORMAL_WEIGHT_SHA__' not in g
          assert 'D60_TRAIN_SHA' in g and 'D60_AUDIT_SHA' in g
          print('D66 parent/child schema, collector and frozen SHA checks OK')
          PY
          python scripts/d66_games.py --help
          python scripts/d66_train.py --help
          python scripts/d66_arena.py --help
          python - <<'PY'
          import shogi
          from fukaji.formal_model import load
          from fukaji.native_nnue import NativeSelector
          m,spec=load()
          with NativeSelector() as n:
              result=n.select(shogi.Board('8k/9/7R1/7L1/9/9/9/9/8K b - 1'),m,movetime_ms=1000)
          assert result.get('research_mate_proven') is True and result.get('research_mate_plies')==1,result
          print('D54 PVS+mate preflight proven')
          PY
      - name: Restore D62 Adam10974 and all protected historical parent families
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download fukaji-d41-d37-selfplay-42017791719 --pattern D41-D37-20runner-selfplay-40games.tar.gz --dir input
          gh release download fukaji-d42-d37-before-vs-d41-after-42218550652 --pattern D42-D37-before-vs-D41-after-100games.tar.gz --dir input
          gh release download fukaji-d43-d37-trained-42292240321 --pattern D43-D37-1000trained-unadopted.tar.gz --dir input
