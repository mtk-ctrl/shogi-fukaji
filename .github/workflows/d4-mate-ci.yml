name: FUKAJI D4 bounded mate proof (research only)
on:
  pull_request:
    paths:
      - 'fukaji/mate_oracle.py'
      - 'tests/test_d4_mate_oracle.py'
      - 'tests/test_d4_three_only_probe.py'
      - 'fukaji/d4_three_only_probe.py'
      - 'fukaji/d4_mate_assist.py'
      - 'fukaji/d4_realgame_probe.py'
      - 'tests/test_d4_realgame_probe.py'
      - 'tests/test_d4_mate_assist.py'
      - '.github/workflows/d4-mate-ci.yml'
  push:
    branches: [main]
    paths:
      - 'fukaji/mate_oracle.py'
      - 'tests/test_d4_mate_oracle.py'
      - 'tests/test_d4_three_only_probe.py'
      - 'fukaji/d4_three_only_probe.py'
      - 'fukaji/d4_mate_assist.py'
      - 'fukaji/d4_realgame_probe.py'
      - 'tests/test_d4_realgame_probe.py'
      - 'tests/test_d4_mate_assist.py'
      - '.github/workflows/d4-mate-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fukaji-d4-mate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_d4_mate_oracle.py' -v
      - run: python -m fukaji.mate_oracle
      - run: python -m unittest discover -s tests -p 'test_d4_three_only_probe.py' -v
      - run: python -m fukaji.d4_three_only_probe --max-positions 500 --max-legal-moves 4000 --max-examples 2
      - run: python -m unittest discover -s tests -p 'test_d4_mate_assist.py' -v
      - run: python -m unittest discover -s tests -p 'test_d4_realgame_probe.py' -v
      - run: python -m fukaji.d4_mate_assist
