name: Hybrid NNUE formal adoption (本人承認後に、周回の候補を正式エンジンのNNUEへ採用)
# 本人が採用を承認した後にだけ commit=true で実行する。実runのartifact(学習報告・対局結果2本)を検証してから、
# 正式エンジン(ハイブリッド)のNNUEを次の版にする。commit=false は検証のみ。旧エンジン(E10)は変更しない。
on:
  workflow_dispatch:
    inputs:
      name:
        description: "新しい版の名前(例: E12)"
        required: true
        type: string
      date:
        description: "承認日 YYYY-MM-DD"
        required: true
        type: string
      commit:
        description: "true=mainへ反映して公開 / false=検証のみ"
        required: true
        default: "false"
        type: string
      run_train:
        description: "G1 train の run ID"
        required: true
        type: string
      run_prev:
        description: "候補対現行正式ハイブリッド100局の run ID"
        required: true
        type: string
      run_kumoji:
        description: "候補対雲路100局の run ID"
        required: true
        type: string
      kumoji_min_wins:
        description: "対雲路で必要な最低勝数(現行正式の勝数以上を目安)"
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: fukaji-hybrid-nnue-adopt
  cancel-in-progress: false
jobs:
  adopt:
    if: github.repository == 'mtk-ctrl/shogi-fukaji'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Contract and formal baseline check
        run: |
          python scripts/check_fukaji_contracts.py
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@v4
        with:
          name: e2-trained-${{ inputs.run_train }}
          path: in/trained
          run-id: ${{ inputs.run_train }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: hybrid-result-${{ inputs.run_prev }}
          path: in/res_prev
          run-id: ${{ inputs.run_prev }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: hybrid-result-${{ inputs.run_kumoji }}
          path: in/res_kumoji
          run-id: ${{ inputs.run_kumoji }}
          github-token: ${{ github.token }}
      - name: Verify results, weights identity and Adam state (and prepare when commit=true)
        run: |
          set -euo pipefail
          mkdir -p build
          FLAG=""; if [ "${{ inputs.commit }}" = "true" ]; then FLAG="--commit"; fi
          python scripts/hybrid_nnue_adopt.py --name "${{ inputs.name }}" --date "${{ inputs.date }}" --trained in/trained \
            --result-prev in/res_prev/result.json --result-kumoji in/res_kumoji/result.json \
            --kumoji-min-wins "${{ inputs.kumoji_min_wins }}" --out build/adopt $FLAG | tee build/adopt.log
          { echo '### NNUE adoption'; echo '```json'; cat build/adopt/receipt.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Full regression, real hybrid USI play with the new weights, legacy engine unchanged
        if: inputs.commit == 'true'
        run: |
          set -euo pipefail
          python scripts/check_fukaji_contracts.py
          python -m unittest discover -s tests -q
          python -m compileall -q fukaji scripts
          git diff --check
          python scripts/run_hybrid.py --prepare
          python scripts/verify_hybrid_release.py --out build/hybrid-verify.json
          python - <<'PY'
          import json
          d=json.load(open('build/hybrid-verify.json')); m=json.load(open('formal/model.json')); r=json.load(open('build/adopt/receipt.json'))
          assert d['weights_sha256']==m['hybrid']['weights_sha256']==r['weights_sha256'] and m['hybrid']['weights_file']==r['weights_path'],d
          assert d['legal_usi_plies']>=30 and d['nnue_active_positions']==d['nnue_checked_positions'],d
          assert m['weights_file']=='models/fukaji-e10.nnue.npz'
          print('real hybrid USI ok')
          PY
      - name: Commit to main with CAS
        if: inputs.commit == 'true'
        id: adoption
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo "main changed; abort"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          W=$(python -c "import json;print(json.load(open('build/adopt/receipt.json'))['weights_path'])")
          D=$(python -c "import json;print(json.load(open('build/adopt/receipt.json'))['decision'])")
          git add -f "$W"
          git add formal/model.json research/d17-fast-self-learning/formal-contract.json
          git add docs/現行エンジン仕様.md docs/00_開発ルーター.md docs/ROADMAP.md AGENTS.md docs/モデル名対応表.md "$D"
          git diff --cached --check
          git diff --cached --name-only | tee build/adopted-files.txt
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          git commit -m "adopt(${{ inputs.name }}): promote self-play round NNUE for the formal hybrid engine (owner-approved ${{ inputs.date }})"
          sha="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$sha"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Release the complete trained state (parent of the next training round)
        if: inputs.commit == 'true'
        env:
          SOURCE_SHA: ${{ steps.adoption.outputs.source_sha }}
        run: |
          set -euo pipefail
          TAG=$(python -c "import json;print(json.load(open('build/adopt/receipt.json'))['release_tag'])")
          ASSET=$(python -c "import json;print(json.load(open('build/adopt/receipt.json'))['release_asset'])")
          tar -czf "build/$ASSET" -C in/trained report.json cand-weights.npz models
          cp build/adopt/receipt.json build/adoption-receipt.json
          gh release create "$TAG" "build/$ASSET" build/hybrid-verify.json build/adoption-receipt.json \
            --target "$SOURCE_SHA" --title "FUKAJI formal hybrid engine: ${{ inputs.name }} NNUE (self-play round)" \
            --notes "${{ inputs.name }} NNUE adopted by owner approval for the formal hybrid engine (KUMOJI search + FUKAJI NNUE). Legacy engine stays on E10. Previous weights preserved in models/."
          mkdir -p build/rb
          for f in "$ASSET" hybrid-verify.json adoption-receipt.json; do
            gh release download "$TAG" --pattern "$f" --dir build/rb
            test "$(sha256sum "build/$f"|cut -d' ' -f1)" = "$(sha256sum "build/rb/$f"|cut -d' ' -f1)"
          done
          echo "${{ inputs.name }} adopted at $SOURCE_SHA; release readback OK" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nnue-adopt-verification-${{ github.run_id }}
          path: |
            build/adopt/receipt.json
            build/adopt.log
            build/hybrid-verify.json
            build/adopted-files.txt
          if-no-files-found: warn
          retention-days: 30
