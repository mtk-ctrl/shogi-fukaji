name: FUKAJI frozen generation 4 research training
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/fukaji-generation4-request.json"
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-generation4-training
  cancel-in-progress: false
jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify all tests and frozen G4 request
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          from fukaji.generation4_train import validate_request
          validate_request(json.loads(Path('.github/fukaji-generation4-request.json').read_text()))
          PY
      - name: Download G3 model, 46 mates and frozen split assignments
        uses: actions/download-artifact@v4
        with:
          name: fukaji-generation3-research-40414745515
          run-id: 40414745515
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/generation4/old
      - name: Download G3 selfplay 72 verified mates
        uses: actions/download-artifact@v4
        with:
          name: fukaji-generation-selfplay-aggregate-40416658637
          run-id: 40416658637
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/generation4/new
      - name: Train G4 on old and new TRAIN parents only
        run: |
          python -m fukaji.generation4_train \
            --request .github/fukaji-generation4-request.json \
            --old-data build/generation4/old/merged_verified_mates.jsonl \
            --old-report build/generation4/old/generation3_report.json \
            --old-splits build/generation4/old/frozen_parent_splits.json \
            --new-data build/generation4/new/verified_mates.jsonl \
            --new-report build/generation4/new/selfplay_aggregate_report.json \
            --generation3 build/generation4/old/mover-relative-generation3-research.npz \
            --out build/generation4/research
      - name: Upload unadopted G4 candidate, split manifest and real mate dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fukaji-generation4-research-${{ github.run_id }}
          path: build/generation4/research/
          retention-days: 30
          if-no-files-found: error
