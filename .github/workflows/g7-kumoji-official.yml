name: FUKAJI G7 vs frozen official KUMOJI
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/fukaji-kumoji-official-request.json"
permissions:
  contents: read
  actions: read
concurrency:
  group: fukaji-kumoji-official
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Check all tests and frozen request
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          from fukaji.kumoji_compare import validate_request
          validate_request(json.loads(Path(".github/fukaji-kumoji-official-request.json").read_text()))
          PY
  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mtk-ctrl/shogi-ai
          ref: 807db500ee2739c1eb6a527b614eeea40a5993d6
          path: kumoji-src
      - name: Build official KUMOJI and verify 163 adopted positions
        run: |
          (cd kumoji-src && python3 scripts/build.py --output "$GITHUB_WORKSPACE/build/kumoji")
          cp kumoji-src/position-knowledge-v1.tsv build/position-knowledge-v1.tsv
          echo "6da204cd1e65600ccdbb9f3dbe463627687d6cf7eb8347da6a103239129dac4c  build/position-knowledge-v1.tsv" | sha256sum -c -
          python3 - <<'PY'
          import json
          m=json.load(open("kumoji-src/position-knowledge-v1.manifest.json"))
          assert m["adopted_positions"]==163
          assert m["output_sha256"]=="6da204cd1e65600ccdbb9f3dbe463627687d6cf7eb8347da6a103239129dac4c"
          PY
          sha256sum build/kumoji
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-kumoji-build-${{ github.run_id }}
          path: build/
          if-no-files-found: error
  paired:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mtk-ctrl/shogi-ai
          ref: 807db500ee2739c1eb6a527b614eeea40a5993d6
          path: kumoji-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: frozen-kumoji-build-${{ github.run_id }}
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: fukaji-generation7-research-40434466661
          run-id: 40434466661
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/g7
      - name: Verify model/knowledge and prepare USI launcher
        run: |
          chmod +x build/kumoji
          printf '#!/bin/sh\nexec python3 -m fukaji.engine\n' > build/fukaji-usi
          chmod +x build/fukaji-usi
          echo "417d18e7b64494c9febdf6d217afbe4e4979e68d04528f16db8b45c0bcde2a0e  build/g7/mover-relative-generation7-research.npz" | sha256sum -c -
          echo "6da204cd1e65600ccdbb9f3dbe463627687d6cf7eb8347da6a103239129dac4c  build/position-knowledge-v1.tsv" | sha256sum -c -
      - name: Play eight independent color-swapped games
        env:
          PYTHONPATH: ${{ github.workspace }}/kumoji-src:${{ github.workspace }}
        run: |
          python -m fukaji.kumoji_compare --mode play \
            --request .github/fukaji-kumoji-official-request.json \
            --g7-model build/g7/mover-relative-generation7-research.npz \
            --kumoji-engine build/kumoji \
            --knowledge build/position-knowledge-v1.tsv \
            --shard ${{ matrix.shard }} --out build/official/part
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fukaji-kumoji-part-${{ matrix.shard }}-${{ github.run_id }}
          path: build/official/part/
          if-no-files-found: warn
  aggregate:
    needs: paired
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mtk-ctrl/shogi-ai
          ref: 807db500ee2739c1eb6a527b614eeea40a5993d6
          path: kumoji-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: fukaji-kumoji-part-*
          path: build/official/parts
          merge-multiple: false
      - name: Replay and audit 64 games / 32 paired openings
        env:
          PYTHONPATH: ${{ github.workspace }}/kumoji-src:${{ github.workspace }}
        run: |
          python -m fukaji.kumoji_compare --mode aggregate \
            --request .github/fukaji-kumoji-official-request.json \
            --parts build/official/parts --out build/official/aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: fukaji-kumoji-aggregate-${{ github.run_id }}
          path: build/official/aggregate/
          if-no-files-found: error
